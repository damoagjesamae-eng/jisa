
<!DOCTYPE html>

<body>

    <h1>Simple Calculator</h1>

    <label>First Number:</label>
    <input type="number" id="first"><br><br>

    <label>Second Number:</label>
    <input type="number" id="second"><br><br>

    <button onclick="compute()">Calculate</button>
    <button onclick="resetCalculator()">Clear</button>

    <h3>Results</h3>

    <p>Sum: <span id="result1"></span></p>
    <p>Difference: <span id="result2"></span></p>
    <p>Product: <span id="result3"></span></p>
    <p>Quotient: <span id="result4"></span></p>

    <script src="script.js"></script>

</body>
